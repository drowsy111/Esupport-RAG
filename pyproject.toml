[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-support-rag"
version = "0.1.0"
description = "Tenant-scoped software delivery and technical support RAG"
requires-python = ">=3.11,<3.14"
dependencies = [
  # PyMilvus 2.4 imports pkg_resources; retain a compatible runtime setuptools.
  "setuptools>=75,<81",
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3", "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.36,<3", "pymysql[rsa]>=1.1,<2", "alembic>=1.14,<2",
  "PyJWT>=2.10,<3", "argon2-cffi>=23.1", "httpx>=0.27,<1",
  "celery[redis]>=5.4,<6", "minio>=7.2,<8", "pymilvus>=2.4.6,<2.5",
  "pypdf>=5.1,<7", "python-docx>=1.1,<2",
  "transformers>=4.44,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pyyaml>=6,<7"]
models = ["FlagEmbedding>=1.3.4,<2", "torch>=2.4,<3"]

[tool.setuptools.packages.find]
include = ["app*", "model_services*", "scripts*"]

[tool.setuptools.package-data]
"app.generation" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
